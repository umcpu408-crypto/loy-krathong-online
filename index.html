  g.fillStyle='rgba(190,165,110,.3)';[[-.3,-.2,.25],[.25,.1,.2],[-.1,.35,.15],[.3,-.4,.1]].forEach(c=>{g.beginPath();g.arc(mx+c[0]*mr,my+c[1]*mr,c[2]*mr,0,7);g.fill()});
  // drifting clouds
  for(let i=0;i<3;i++){const cx=((t/90000*(1+i*.4)+i*.37)%1.3-.15)*W,cy=waterY*(.25+i*.2);gr=g.createRadialGradient(cx,cy,5,cx,cy,W*.14);gr.addColorStop(0,'rgba(120,120,190,.16)');gr.addColorStop(1,'rgba(120,120,190,0)');g.fillStyle=gr;g.fillRect(cx-W*.14,cy-40,W*.28,80)}
  return{mx,my,mr}
}
function water(t,m){
  let gr=g.createLinearGradient(0,waterY,0,H);gr.addColorStop(0,'#26275a');gr.addColorStop(.25,'#12204a');gr.addColorStop(1,'#040814');g.fillStyle=gr;g.fillRect(0,waterY,W,H-waterY);
  g.globalAlpha=.22;skyline(t,true);g.globalAlpha=1;
  g.fillStyle=gr;g.globalAlpha=.55;g.fillRect(0,waterY,W,(H-waterY)*.35);g.globalAlpha=1;
  for(let y=waterY;y<H;y+=4){const k=(y-waterY)/(H-waterY),w=m.mr*(1.2-k*.5)*(.6+.4*Math.sin(y*.3+t/500));g.fillStyle='rgba(255,240,200,'+(.26*(1-k))+')';g.fillRect(m.mx-w+Math.sin(y*.12+t/700)*8,y,w*2,2)}
  g.lineWidth=1;
  for(let i=0;i<16;i++){const k=i/16,y=waterY+(k**1.6)*(H-waterY)+8;g.strokeStyle='rgba(170,195,255,'+(.05+.12*k)+')';g.beginPath();for(let x=0;x<=W;x+=14){const yy=y+Math.sin(x*.02+t/800+i)*(2+i*.3);x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke()}
  specks.forEach(s=>{const a=Math.max(0,Math.sin(t/400+s.t));if(a<.6)return;g.fillStyle='rgba(255,240,210,'+(a-.5)*.7+')';g.fillRect(s.x*W,waterY+s.y*s.y*(H-waterY),2,1)})
}
function petal(x,y,a,len,w,c){g.save();g.translate(x,y);g.rotate(a);const gr=g.createLinearGradient(0,0,0,-len);gr.addColorStop(0,sh(c,-.35));gr.addColorStop(.55,c);gr.addColorStop(1,sh(c,.55));g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(w,-len*.5,0,-len);g.quadraticCurveTo(-w,-len*.5,0,0);g.fill();g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=.6;g.beginPath();g.moveTo(0,-2);g.lineTo(0,-len*.8);g.stroke();g.restore()}
function leafBase(b){b=b||'#3f9a4d';let gr=g.createLinearGradient(0,-8,0,10);gr.addColorStop(0,sh(b,.3));gr.addColorStop(1,sh(b,-.5));g.fillStyle=gr;g.beginPath();g.ellipse(0,0,36,11,0,0,7);g.fill();g.strokeStyle='rgba(20,70,30,.6)';g.lineWidth=1;for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(i*9,-9);g.lineTo(i*10,9);g.stroke()}g.fillStyle=sh(b,.5);g.globalAlpha=.4;g.beginPath();g.ellipse(0,-4,30,4,0,0,7);g.fill();g.globalAlpha=1}
function krathong(k,p,t,hover){
  const s=p.sc*(W<600?.85:1),fade=Math.min(1,p.f*12,(1-p.f)*10);if(fade<=0)return;
  const fl=.85+.15*Math.sin(t/110+k.seed*3);
  g.save();g.translate(p.x,p.y);g.scale(s,s);g.globalAlpha=Math.max(0,fade);
  // ripples + flame reflection in water
  for(let i=0;i<(LITE?0:2);i++){const r=((t/2200+i*.5+k.seed)%1);g.strokeStyle='rgba(200,220,255,'+(.3*(1-r))+')';g.lineWidth=1;g.beginPath();g.ellipse(0,6,36+r*30,8+r*8,0,0,7);g.stroke()}
  let gr=g.createLinearGradient(0,8,0,70);gr.addColorStop(0,'rgba(255,170,60,.5)');gr.addColorStop(1,'rgba(255,170,60,0)');g.fillStyle=gr;
  for(let y=8;y<(LITE?8:70);y+=3){g.globalAlpha=Math.max(0,fade)*(1-y/70)*.6;g.fillRect(-4+Math.sin(y*.3+t/300)*3,y,8*(1-y/90),2)}g.globalAlpha=Math.max(0,fade);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,6,36,7,0,0,7);g.fill();
  const bs=k.base||(['heart','boat','star'].includes(k.style)?'#c99a45':'#3f9a4d');
  if(k.style==='leaf'){leafBase(bs);for(let i=-3;i<=3;i++)petal(i*10,-3,i*.2,24,7,k.col)}
  else if(k.style==='heart'){gr=g.createLinearGradient(0,-8,0,10);gr.addColorStop(0,sh(bs,.4));gr.addColorStop(1,sh(bs,-.3));g.fillStyle=gr;g.beginPath();g.ellipse(0,0,36,11,0,0,7);g.fill();
    gr=g.createRadialGradient(-6,-26,2,0,-18,28);gr.addColorStop(0,sh(k.col,.5));gr.addColorStop(1,sh(k.col,-.25));g.fillStyle=gr;g.beginPath();g.moveTo(0,-4);g.bezierCurveTo(-36,-30,-12,-46,0,-26);g.bezierCurveTo(12,-46,36,-30,0,-4);g.fill();g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(-10,-28,5,3,-.6,0,7);g.fill()}
  else if(k.style==='rose'){leafBase(bs);[-18,0,18].forEach(x=>{for(let j=0;j<3;j++){g.fillStyle=sh(k.col,-.35+j*.22);g.beginPath();g.arc(x+(j-1)*1.5,-8-j*.8,11-j*3.4,0,7);g.fill();g.strokeStyle=sh(k.col,-.5);g.lineWidth=.8;g.stroke()}})}
  else if(k.style==='champa'){leafBase(bs);for(let i=-3;i<=3;i++)petal(i*6,-3,i*.3,36,4.5,k.col);for(let i=-2;i<=2;i++)petal(i*5,-3,i*.2,26,3.5,sh(k.col,.4));g.fillStyle='#ffd35e';g.beginPath();g.ellipse(0,-5,5,2.5,0,0,7);g.fill()}
  else if(k.style==='boat'){gr=g.createLinearGradient(0,-8,0,12);gr.addColorStop(0,sh(bs,.35));gr.addColorStop(1,sh(bs,-.4));g.fillStyle=gr;g.beginPath();g.moveTo(-40,-8);g.quadraticCurveTo(-34,12,0,13);g.quadraticCurveTo(34,12,40,-8);g.quadraticCurveTo(0,-1,-40,-8);g.fill();g.strokeStyle='#6b3b1c';g.lineWidth=1.4;g.beginPath();g.moveTo(-24,-4);g.lineTo(-24,-42);g.stroke();g.fillStyle=k.col;g.beginPath();g.moveTo(-23,-40);g.lineTo(-23,-12);g.lineTo(-4,-14);g.closePath();g.fill();g.fillStyle=sh(k.col,.3);g.beginPath();g.moveTo(25,-5);g.lineTo(25,-30);g.lineTo(38,-8);g.closePath();g.fill()}
  else if(k.style==='star'){gr=g.createLinearGradient(0,-8,0,10);gr.addColorStop(0,sh(bs,.4));gr.addColorStop(1,sh(bs,-.3));g.fillStyle=gr;g.beginPath();g.ellipse(0,0,36,11,0,0,7);g.fill();g.fillStyle=k.col;g.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,r=i%2?11:27;g.lineTo(Math.cos(a)*r,-15+Math.sin(a)*r*.9)}g.closePath();g.fill();g.fillStyle=sh(k.col,.45);g.beginPath();g.arc(0,-15,8,0,7);g.fill()}
  else{leafBase(bs);[-1,1].forEach(d=>{for(let i=0;i<3;i++)petal(d*(12+i*7),-3,d*(1.05+i*.12),24,8,sh(k.col,-.12))});
    for(let i=-3;i<=3;i++)petal(i*5,-3,i*.26,30,9,k.col);for(let i=-2;i<=2;i++)petal(i*4,-3,i*.18,20,6,sh(k.col,.25));
    g.fillStyle='#ffd35e';g.beginPath();g.ellipse(0,-6,5,2.5,0,0,7);g.fill()}
  const cn=k.cn||1; /* incense */
  g.lineWidth=1.2;[[-10-3*(cn-1),-5],[10+3*(cn-1),5]].forEach(a=>{g.strokeStyle='#6b3b1c';g.beginPath();g.moveTo(a[0],-8);g.lineTo(a[0]+a[1],-40);g.stroke();g.fillStyle='#ff5a30';g.shadowColor='#ff5a30';g.shadowBlur=6;g.fillRect(a[0]+a[1]-1,-41,2,2);g.shadowBlur=0});
  const CD=cn===3?[-9,0,9]:cn===2?[-6,6]:[0];CD.forEach((ox,ci)=>{g.save();g.translate(ox,0);
  gr=g.createLinearGradient(-2.5,0,2.5,0);gr.addColorStop(0,'#e9d3a0');gr.addColorStop(.5,'#fff3d2');gr.addColorStop(1,'#d8bf88');g.fillStyle=gr;g.fillRect(-2.5,-28,5,22);
  if(!LITE||!ci){g.globalCompositeOperation='lighter';gr=g.createRadialGradient(0,-33,1,0,-33,(LITE?46:72)*fl*(cn>1?.8:1));gr.addColorStop(0,'rgba(255,190,90,.6)');gr.addColorStop(1,'rgba(255,140,40,0)');g.fillStyle=gr;g.fillRect(-80,-110,160,160);g.globalCompositeOperation='source-over';}
  g.fillStyle='#ffb43c';g.beginPath();g.ellipse(0,-34,3.6*fl,8*fl,Math.sin(t/160+k.seed)*.15,0,7);g.fill();g.fillStyle='#fff7d0';g.beginPath();g.ellipse(0,-33,1.5,4*fl,0,0,7);g.fill();g.restore()});
  if(hover){g.strokeStyle='#fff';g.lineWidth=1.5;g.globalAlpha=.7;g.beginPath();g.ellipse(0,-16,48,36,0,0,7);g.stroke()}
  g.restore();
  const FS=SCREEN?Math.max(1,Math.min(2.2,W/1100)):1;if(!(hover||labelSet.has(k.id)||k.id.slice(0,3)==='bot'))return;const ML=SCREEN?34:22;g.save();g.globalAlpha=Math.max(0,fade)*.92;g.font='600 '+((12*s+1)*FS)+'px "Noto Sans Thai",Sarabun,sans-serif';g.textAlign='center';g.fillStyle='#fff4d6';g.shadowColor='#000';g.shadowBlur=7;
  const ly=p.y-64*s*(1+(FS-1)*.4);g.fillText(k.msg.length>ML?k.msg.slice(0,ML-1)+'…':k.msg,p.x,ly);if(k.nick){g.font='500 '+((10*s+1)*FS)+'px "Noto Sans Thai",Sarabun,sans-serif';g.fillStyle='#ffc861';g.fillText('— '+k.nick,p.x,ly+(13*s+2)*FS)};g.restore();
}
function extras(t,dt){
  lants.forEach(l=>{const q=((t/1000*l.sp+l.off)%1.15),y=H*(1.05-q),x=(l.x+Math.sin(t/2500+l.ph)*.02)*W,z=l.z*(W<600?.7:1);if(y<-30)return;g.globalAlpha=Math.min(1,q*6)*Math.min(1,(1.1-q)*4);
    g.globalCompositeOperation='lighter';let gr=g.createRadialGradient(x,y,2,x,y,z*3);gr.addColorStop(0,'rgba(255,170,70,.5)');gr.addColorStop(1,'rgba(255,120,30,0)');g.fillStyle=gr;g.fillRect(x-z*3,y-z*3,z*6,z*6);g.globalCompositeOperation='source-over';
    gr=g.createLinearGradient(0,y-z,0,y+z);gr.addColorStop(0,'#ffe3a0');gr.addColorStop(1,'#ff8a3c');g.fillStyle=gr;g.beginPath();g.moveTo(x-z*.5,y+z*.7);g.lineTo(x-z*.7,y-z*.3);g.quadraticCurveTo(x,y-z*1.3,x+z*.7,y-z*.3);g.lineTo(x+z*.5,y+z*.7);g.fill()});g.globalAlpha=1;
  g.globalCompositeOperation='lighter';
  flies.forEach(f=>{f.p+=dt*.001*f.s;const x=((f.x+Math.sin(f.p)*.03)%1)*W,y=(f.y+Math.cos(f.p*1.3)*.03)*H;g.fillStyle='rgba(214,255,122,'+(.3+.6*Math.abs(Math.sin(t/500+f.p*3)))+')';g.beginPath();g.arc(x,y,2.2,0,7);g.fill()});
  sparks=sparks.filter(s=>s.l>0);sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.03;s.l-=.016;g.fillStyle='rgba(255,210,120,'+Math.max(0,s.l)+')';g.fillRect(s.x,s.y,2.5,2.5)});
  g.globalCompositeOperation='source-over';
  const gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,10,.55)');g.fillStyle=gr;g.fillRect(0,0,W,H)
}
let last=performance.now();
function all(now){return items.filter(k=>!k.bad&&!hid.has(k.id)).concat(bots(now))}
function frame(t){
  const dt=t-last;last=t;const now=Date.now();
  g.clearRect(0,0,W,H);const m=sky(t);skyline(t,false);water(t,m);
  const L=all(now);LITE=L.length>45;labelSet=new Set(L.filter(k=>k.id.slice(0,3)!=='bot').sort((a,b)=>b.born-a.born).slice(0,30).map(k=>k.id));
  L.map(k=>({k,p:pos(k,now)})).filter(o=>o.p.f>=0).sort((a,b)=>a.p.y-b.p.y).forEach(o=>krathong(o.k,o.p,t,o.k===tipItem));
  extras(t,dt);drawPv(t);requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
function hit(x,y){const now=Date.now();let best=null,bd=1e9;all(now).forEach(k=>{const p=pos(k,now);if(p.f<0)return;const d=Math.hypot((x-p.x)/(1.3*p.sc),(y-(p.y-14))/p.sc);if(d<48&&d<bd){bd=d;best=k}});return best}
function show(e){if(pend)return;const k=hit(e.clientX,e.clientY);tipItem=k;tip.textContent='';if(k){tip.appendChild(document.createTextNode('🪔 '+k.msg+(k.nick?' — '+k.nick:'')));tip.style.left=Math.min(e.clientX+12,W-250)+'px';tip.style.top=Math.max(e.clientY-70,8)+'px';tip.style.opacity=1}else tip.style.opacity=0}
cv.addEventListener('pointerdown',e=>{if(!isAdmin||!hc)return;const k=hit(e.clientX,e.clientY);if(!k||k.id.slice(0,3)==='bot')return;if(pend===k.id){hc.doc(k.id).set({at:Date.now()}).catch(()=>{});pend=null;tip.style.opacity=0}else{pend=k.id;tip.textContent='⚠ แตะอีกครั้งเพื่อซ่อนกระทงนี้ (แอดมิน)';tip.style.opacity=1;setTimeout(()=>{if(pend===k.id)pend=null},4000)}});
cv.addEventListener('pointermove',show);cv.addEventListener('pointerdown',show);
})();
